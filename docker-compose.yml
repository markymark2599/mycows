services:
  app:
    build: .
    ports:
      - "8081:8081"
    volumes:
      # Live-edit source from the host.
      - .:/app
      # Keep the container's Linux node_modules separate from the host's.
      - node_modules:/app/node_modules
    environment:
      - EXPO_NO_TELEMETRY=1
    # Optional per-machine settings, e.g. REACT_NATIVE_PACKAGER_HOSTNAME for
    # --lan mode, and EXPO_TOKEN. See README and .env.example.
    env_file:
      - path: .env
        required: false
    command: npx expo start ${EXPO_START_FLAGS:---tunnel ngrok}
    tty: true
    stdin_open: true

volumes:
  node_modules:
